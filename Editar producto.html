<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <header>
        <h1>Editar producto</h1>
    </header>
    <main>
        <form>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" value="Polo Oversize">

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion">Polo de algodón color negro.</textarea>

            <label for="categoria">Categoría</label>
            <select id="categoria">
                <option selected>Polos</option>
                <option>Pantalones</option>
                <option>Casacas</option>
            </select>

            <label for="precio">Precio</label>
            <input type="number" id="precio" step="0.01" value="49.90">

            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" value="12">

            <button type="submit">Guardar cambios</button>
        </form>

        <p><a href="detalle-producto.html">Cancelar</a></p>
    </main>
</body>
</html>
